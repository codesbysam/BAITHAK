version: '3.8'

services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/meetspace
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey
      - JWT_REFRESH_SECRET=supersecretrefreshkey
      - CORS_ORIGIN=http://localhost:5173
      - TURN_SECRET=my_turn_secret
      - TURN_URL=turn:localhost:3478
      - STUN_URL=stun:localhost:3478
      - MAX_PARTICIPANTS=6
    depends_on:
      - mongo
      - redis
      - coturn

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - server

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  coturn:
    image: coturn/coturn
    command: -c /etc/coturn/turnserver.conf
    network_mode: "host"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf

volumes:
  mongo_data:
  redis_data:
